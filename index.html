<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tu Chispa Interior 🔥</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #1a1412;
      --paper: #fdf8f2;
      --ember: #e8500a;
      --ember-light: #ff7a3c;
      --muted: #9a8a7c;
      --border: #e2d8cc;
      --warm-white: #fff9f4;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 640px;
      padding: 2.5rem 1.5rem 3.5rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2.8rem;
    }

    .flame-icon {
      font-size: 2.4rem;
      display: inline-block;
      animation: flicker 2.5s ease-in-out infinite;
      margin-bottom: 0.5rem;
    }

    @keyframes flicker {
      0%,100% { transform: scaleY(1) rotate(-1deg); }
      25%      { transform: scaleY(1.06) rotate(1deg); }
      50%      { transform: scaleY(0.96) rotate(-0.5deg); }
      75%      { transform: scaleY(1.04) rotate(0.8deg); }
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.9rem, 5vw, 2.7rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .title em { font-style: italic; color: var(--ember); }

    .subtitle {
      margin-top: 0.6rem;
      font-size: 0.82rem;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .textarea-label {
      display: block;
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.6rem;
    }

    .textarea-wrap {
      position: relative;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--warm-white);
      transition: border-color 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .textarea-wrap:focus-within {
      border-color: var(--ember);
      box-shadow: 0 0 0 3px rgba(232,80,10,0.08);
    }

    textarea {
      width: 100%;
      min-height: 130px;
      padding: 1rem 1.1rem 2.4rem;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      color: var(--ink);
      line-height: 1.65;
    }

    textarea::placeholder { color: #c4b8ad; font-style: italic; }

    .char-count {
      position: absolute;
      bottom: 0.55rem; right: 0.9rem;
      font-size: 0.72rem;
      color: var(--muted);
      pointer-events: none;
    }

    .hint {
      text-align: right;
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.4rem;
      margin-bottom: 1.6rem;
    }

    .btn-wrap {
      position: relative;
      display: flex;
      justify-content: center;
    }

    .sparks-container {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .spark {
      position: absolute;
      border-radius: 50%;
      background: var(--ember-light);
      top: 50%; left: 50%;
      opacity: 0;
    }

    .spark.fly { animation: sparkFly 0.65s ease-out forwards; }

    @keyframes sparkFly {
      0%   { opacity: 1; transform: translate(var(--sx0), var(--sy0)); }
      100% { opacity: 0; transform: translate(var(--sx1), var(--sy1)); }
    }

    .generate-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.9rem 2.4rem;
      background: var(--ember);
      color: white;
      border: none;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(232,80,10,0.28);
    }

    .generate-btn::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 60%);
      border-radius: 50px;
    }

    .generate-btn:hover:not(:disabled) {
      background: var(--ember-light);
      transform: translateY(-2px);
      box-shadow: 0 6px 28px rgba(232,80,10,0.38);
    }

    .generate-btn:disabled { opacity: 0.55; cursor: not-allowed; box-shadow: none; }

    .dots { display: flex; gap: 5px; align-items: center; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: white;
      animation: bounce 1.2s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%,80%,100% { transform: scale(0.7); opacity: 0.5; }
      40%          { transform: scale(1);   opacity: 1; }
    }

    .divider {
      display: flex; align-items: center; gap: 0.8rem;
      margin: 2rem 0 0;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .divider span {
      font-size: 0.7rem; color: var(--muted);
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    .response-card {
      margin-top: 1.2rem;
      border-radius: 14px; overflow: hidden;
      background: linear-gradient(145deg, #fff5ee, #fff9f4);
      border: 1.5px solid rgba(232,80,10,0.18);
      box-shadow: 0 8px 32px rgba(232,80,10,0.08);
      animation: slideUp 0.45s cubic-bezier(0.22,1,0.36,1) forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .response-header {
      display: flex; align-items: center; gap: 0.5rem;
      padding: 0.7rem 1.2rem;
      background: rgba(232,80,10,0.06);
      border-bottom: 1px solid rgba(232,80,10,0.1);
    }

    .response-badge {
      font-size: 0.7rem; font-weight: 500;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--ember);
    }

    .word-count { margin-left: auto; font-size: 0.68rem; color: var(--muted); }

    .response-body { padding: 1.4rem 1.5rem 0.8rem; }

    .response-text {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem; line-height: 1.78;
      color: var(--ink); font-style: italic;
    }

    .quote-mark {
      display: inline-block; font-size: 2.5rem;
      line-height: 0.6; vertical-align: -0.3em;
      margin-right: 3px; color: var(--ember);
      font-style: normal; opacity: 0.55;
    }

    .copy-btn {
      display: flex; align-items: center; gap: 0.4rem;
      margin: 0.8rem 1.5rem 1.2rem auto;
      width: fit-content;
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 0.35rem 0.9rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.75rem; color: var(--muted);
      cursor: pointer; transition: all 0.2s;
    }
    .copy-btn:hover { border-color: var(--ember); color: var(--ember); }

    .error-msg {
      margin-top: 1.2rem; padding: 0.9rem 1rem;
      border-radius: 10px;
      background: #fff0eb; border: 1px solid #f4c4b2;
      color: #b84020; font-size: 0.88rem;
      text-align: center; line-height: 1.5;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="flame-icon">🔥</div>
    <h1 class="title">Tu chispa <em>interior</em></h1>
    <p class="subtitle">Motivación personalizada con IA</p>
  </div>

  <label class="textarea-label" for="userInput">¿Qué estás viviendo o sintiendo?</label>
  <div class="textarea-wrap">
    <textarea
      id="userInput"
      placeholder="Escribí lo que tenés en el corazón… un desafío, una duda, un sueño…"
      oninput="updateChar()"
      onkeydown="handleKey(event)"
    ></textarea>
    <span class="char-count" id="charCount">0</span>
  </div>
  <p class="hint">Ctrl + Enter para generar</p>

  <div class="btn-wrap">
    <div class="sparks-container" id="sparksContainer"></div>
    <button class="generate-btn" id="generateBtn" onclick="generate()" disabled>
      <span>✦</span><span id="btnLabel">Inspirame</span>
    </button>
  </div>

  <div class="error-msg hidden" id="errorMsg"></div>

  <div class="hidden" id="responseSection">
    <div class="divider"><span>Tu mensaje</span></div>
    <div class="response-card">
      <div class="response-header">
        <span>✦</span>
        <span class="response-badge">Para vos</span>
        <span class="word-count" id="wordCount"></span>
      </div>
      <div class="response-body">
        <p class="response-text" id="responseText"></p>
      </div>
      <button class="copy-btn" onclick="copyText()">
        <span id="copyIcon">📋</span> <span id="copyLabel">Copiar mensaje</span>
      </button>
    </div>
  </div>

</div>
<script>
  function updateChar() {
    const val = document.getElementById("userInput").value;
    document.getElementById("charCount").textContent = val.length;
    document.getElementById("generateBtn").disabled = val.trim().length === 0;
  }

  function handleKey(e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) generate();
  }

  function burstSparks() {
    const container = document.getElementById("sparksContainer");
    container.innerHTML = "";
    for (let i = 0; i < 18; i++) {
      const angle = (360 / 18) * i * (Math.PI / 180);
      const dist = 60 + Math.random() * 40;
      const size = 3 + Math.random() * 4;
      const delay = Math.random() * 0.3;
      const el = document.createElement("div");
      el.className = "spark";
      el.style.cssText = `width:${size}px;height:${size}px;--sx0:-50%;--sy0:-50%;--sx1:calc(-50% + ${Math.cos(angle)*dist}px);--sy1:calc(-50% + ${Math.sin(angle)*dist}px);animation-delay:${delay}s;`;
      container.appendChild(el);
      requestAnimationFrame(() => el.classList.add("fly"));
    }
    setTimeout(() => container.innerHTML = "", 1000);
  }

  async function generate() {
    const texto = document.getElementById("userInput").value.trim();
    if (!texto) return;

    const btn = document.getElementById("generateBtn");
    btn.disabled = true;
    document.getElementById("btnLabel").innerHTML = `<span class="dots"><span></span><span></span><span></span></span>`;
    document.getElementById("errorMsg").classList.add("hidden");
    document.getElementById("responseSection").classList.add("hidden");

    try {
      const res = await fetch("/api/motivar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texto })
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Error del servidor");

      const words = data.mensaje.split(/\s+/).filter(Boolean).length;
      document.getElementById("responseText").innerHTML = `<span class="quote-mark">"</span>${data.mensaje}`;
      document.getElementById("wordCount").textContent = `${words} palabras`;
      document.getElementById("responseSection").classList.remove("hidden");
      burstSparks();

    } catch (err) {
      const errEl = document.getElementById("errorMsg");
      errEl.textContent = err.message || "Ocurrió un error. Intentá de nuevo.";
      errEl.classList.remove("hidden");
    } finally {
      btn.disabled = false;
      document.getElementById("btnLabel").innerHTML = "✦ Inspirame";
    }
  }

  async function copyText() {
    const text = document.getElementById("responseText").innerText.replace(/^"/, "").trim();
    try {
      await navigator.clipboard.writeText(text);
      document.getElementById("copyIcon").textContent = "✅";
      document.getElementById("copyLabel").textContent = "¡Copiado!";
      setTimeout(() => {
        document.getElementById("copyIcon").textContent = "📋";
        document.getElementById("copyLabel").textContent = "Copiar mensaje";
      }, 2000);
    } catch { alert("Seleccioná el texto manualmente."); }
  }
</script>
</body>
</html>
